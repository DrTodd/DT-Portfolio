<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Page Website</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: url('background.svg') no-repeat center center fixed;
            background-color: #000000;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
        }
        .container {
            text-align: center;
            position: absolute;
            top: 30%;
            transform: translateY(-30%);
        }
        .profile-pic {
            width: 25vh;
            height: 25vh;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0px 0px 40px 40px #000000;
        }
        .text {
            margin-top: 20px;
            color: #F2F3F4;
            font-size: 3rem;
        }
        .link {
            margin-top: 10px;
            display: block;
            text-decoration: underline;
            color: #F2F3F4;
            font-size: 1.5rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="portrait.jpg" alt="A portrait of Devin" class="profile-pic">
        <div class="text">&#128075 Hi, I'm Devin!</div>
        <!-- 2024.07.22 version of portfolio -->
        <a href="portfolio.pdf" class="link">Check out my portfolio</a>
    </div>
</body>

</html>
